
name: Generate GitHub Statistics

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=TechParthOps&show_icons=true&theme=gruvbox&hide_border=false&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=TechParthOps&layout=compact&langs_count=8&theme=gruvbox&hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=TechParthOps&theme=dark&hide_border=false&disable_animations=true
          path: profile/streak.svg

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "Statistics have not changed."
            exit 0
          fi

          git commit -m "chore: update GitHub statistics"
          git push
